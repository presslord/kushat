<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Меню на день" />
  <title>Меню на день 🍳</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ЭКРАН 1: Календарь -->
    <section id="screen-calendar" class="screen active">
      <header class="header">
        <h1>📅 Меню на день</h1>
        <p class="subtitle">Рацион для набора веса • мы вдвоём 💪</p>
      </header>
      <div class="install-banner" id="installBanner" style="display:none">
        <span>📲 Установить как приложение?</span>
        <button id="btnInstall">Установить</button>
        <button id="btnInstallClose" class="dismiss">✕</button>
      </div>
      <div class="cal-nav">
        <button id="calPrev" class="cal-arrow">‹</button>
        <div id="calTitle" class="cal-title"></div>
        <button id="calNext" class="cal-arrow">›</button>
      </div>
      <div class="cal-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
      <div id="calGrid" class="cal-grid"></div>
      <div class="legend">
        <span>🟢 всё готово</span><span>🟡 выбрано не всё</span><span>⚪ пусто</span>
      </div>
      <nav class="bottom-nav" data-nav="calendar"></nav>
    </section>

    <!-- ЭКРАН 2: День (редактор) -->
    <section id="screen-day" class="screen">
      <header class="header small">
        <button class="btn-back" id="btnBackCal">←</button>
        <div>
          <h1 id="dayTitle" class="day-title">День</h1>
          <p class="subtitle" id="daySubtitle"></p>
        </div>
        <button class="btn-dice" id="btnDice" title="Случайный вариант">🎲</button>
      </header>
      <div id="daySlots" class="day-slots"></div>
      <div class="actions-row">
        <button class="btn-like" id="btnLike">❤️ Отметить день</button>
        <button class="btn-share" id="btnShare">📤 Поделиться</button>
      </div>
      <nav class="bottom-nav" data-nav="day"></nav>
    </section>

    <!-- ЭКРАН 3: Банк вариантов -->
    <section id="screen-bank" class="screen">
      <header class="header small">
        <button class="btn-back" id="btnBackBank">←</button>
        <div><h1>📖 Банк вариантов</h1><p class="subtitle">Всё меню для ротации</p></div>
        <span class="spacer"></span>
      </header>
      <div id="bankContent" class="bank-content"></div>
      <nav class="bottom-nav" data-nav="bank"></nav>
    </section>

    <!-- Модалка выбора блюда -->
    <div id="modal" class="modal" style="display:none">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 id="modalTitle">Выберите блюдо</h2>
          <button id="modalClose" class="modal-close">✕</button>
        </div>
        <div id="modalList" class="modal-list"></div>
        <button id="modalClear" class="btn-clear">🗑 Очистить слот</button>
      </div>
    </div>

    <!-- Тост -->
    <div id="toast" class="toast" style="display:none"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
